services:
  openclaw:
    build:
      context: .
      args:
        OPENCLAW_VERSION: ${OPENCLAW_VERSION:-latest}
    # No fixed image/container_name here on purpose: Compose derives both
    # from the project directory name automatically, so cloning this repo
    # into a second directory (e.g. for another client on the same host)
    # just works — distinct image, distinct container, no collision. Set
    # OPENCLAW_PORT in that second .env to avoid a port clash too.
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Always "lan" for Docker, regardless of what .env says — a process
      # bound to loopback inside the container's network namespace is not
      # reachable through the `ports` mapping below. This is intentionally
      # NOT ${OPENCLAW_GATEWAY_BIND} — .env's value (used by the bare-metal
      # path) must never leak in here and break the Docker deploy.
      OPENCLAW_GATEWAY_BIND: lan
    volumes:
      # The whole repo becomes ~/.openclaw inside the container.
      # Config, skills, workspace, memory, and agent state all persist
      # on the host — `git pull` here updates the running assistant.
      - ./:/root/.openclaw
    ports:
      # Published on the HOST's loopback only. The control UI is never
      # exposed to the internet — reach it from your machine with:
      #   ssh -L 18789:127.0.0.1:18789 user@your-vps
      # Telegram and model APIs are outbound and unaffected.
      - "127.0.0.1:${OPENCLAW_PORT:-18789}:18789"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:18789/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
