services:
  openclaw:
    build:
      context: .
      args:
        OPENCLAW_VERSION: ${OPENCLAW_VERSION:-latest}
    image: openclaw-business-assistant
    container_name: openclaw-business-assistant
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the container the gateway binds to the container network;
      # the `ports` mapping below controls what's actually exposed.
      OPENCLAW_GATEWAY_BIND: ${OPENCLAW_GATEWAY_BIND:-lan}
    volumes:
      # The whole repo becomes ~/.openclaw inside the container.
      # Config, skills, workspace, memory, and agent state all persist
      # on the host — `git pull` here updates the running assistant.
      - ./:/root/.openclaw
    ports:
      # Published on the HOST's loopback only. The control UI is never
      # exposed to the internet — reach it from your machine with:
      #   ssh -L 18789:127.0.0.1:18789 user@your-vps
      # Telegram and model APIs are outbound and unaffected.
      - "127.0.0.1:${OPENCLAW_PORT:-18789}:18789"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:18789/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
